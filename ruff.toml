# Root guard, not a rule set.
#
# The real ruff configuration lives in rhythmic/pyproject.toml, and ruff resolves
# the nearest config per file, so rhythmic/ still lints under its own selection
# no matter which directory you invoke ruff from.
#
# This file exists only so that a ruff run started at the repo root cannot reach
# legacy/. That tree is reference material and must not be rewritten -- a stray
# `ruff check --fix` from here once reordered its imports and converted .format()
# calls to f-strings across 25 files.

# It also excludes *.md. `ruff format` reformats Python code blocks INSIDE markdown,
# so a run from here rewrites the plans and the spec: it turned the settings snippet
# `    "questions",` into `("questions",)` in the questions-app plan on 2026-08-25.
# Those blocks are deliberately partial -- they are fragments to paste, not modules.

extend-exclude = ["legacy", "*.md"]
