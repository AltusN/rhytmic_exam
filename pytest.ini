# The single pytest config for this repository. Deliberately at the root and not in
# rhythmic/pyproject.toml, because only a config up here can see legacy/ in order to
# exclude it.
#
# Keep it the only one. pytest picks its config by walking UP from the common ancestor
# of the arguments and stopping at the first match, so a [tool.pytest.ini_options]
# section in rhythmic/pyproject.toml would win for every run started inside rhythmic/
# — including VSCode's, which uses cwd=rhythmic — and this file would apply only to
# runs started from the root. Two configs that agree today are two configs that drift.
[pytest]

# Relative to rootdir, which is this directory.
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = rhythmic

# Where a bare `pytest` collects from. Ignored the moment an argument is passed, so
# this is a convenience, never a safety boundary — norecursedirs below is the boundary.
testpaths = rhythmic/tests

# pytest REPLACES its defaults when this is set rather than extending them, so the
# stock list is repeated here. Dropping it would let a run walk .venv/ and build/.
# legacy/ is the addition: it holds three Flask-era test files that must never run.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} legacy
